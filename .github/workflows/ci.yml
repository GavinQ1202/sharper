name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]" hatchling
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Task20 public surface and CLI gate
        run: |
          python -c "import sharper; assert sharper.__version__ == '0.2.0'; assert sharper.__all__[-9:] == ['V02ScoreValidationRequest', 'V02AuditRequest', 'V02PreLoanRequest', 'V02PostLoanRequest', 'V02GovernanceRequest', 'V02WorkflowRequest', 'V02WorkflowResult', 'run_v02_workflow', 'generate_v02_report']"
          python -m sharper.cli v02-run --help
      - name: Task20 example smoke
        run: |
          python examples/v02_score_validation.py
          python examples/v02_preloan.py
          python examples/v02_postloan.py
          python examples/v02_combined_report.py
          python examples/v02_cli_json.py
      - if: matrix.python-version == '3.12'
        run: python -m build --no-isolation
