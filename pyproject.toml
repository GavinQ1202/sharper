[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sharper"
dynamic = ["version"]
description = "A structured tabular data analysis toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sharper contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
    "scipy",
    "typer",
]

[project.scripts]
sharper = "sharper.cli:app"

[project.optional-dependencies]
excel = ["openpyxl"]
dev = [
    "build",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.version]
path = "src/sharper/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sharper"]

[tool.pytest.ini_options]
addopts = "--strict-markers --tb=short"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
